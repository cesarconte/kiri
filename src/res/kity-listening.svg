<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <defs>
    <!-- Radiant Listening Green/Cyan Gradient -->
    <linearGradient id="listenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <radialGradient id="listenCore" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#69f0ae" />
      <stop offset="100%" stop-color="#00c853" />
    </radialGradient>
  </defs>

  <!-- Expanded Active Listening Resonance Waves -->
  <path d="M 2.2 7.0 C 0.8 9.5 0.8 12.5 2.2 15.0" fill="none" stroke="#00e5ff" stroke-width="1.3" stroke-linecap="round" opacity="0.6" />
  <path d="M 4.4 7.8 C 3.2 9.7 3.2 12.3 4.4 14.2" fill="none" stroke="#69f0ae" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />

  <path d="M 19.8 7.0 C 21.2 9.5 21.2 12.5 19.8 15.0" fill="none" stroke="#00e5ff" stroke-width="1.3" stroke-linecap="round" opacity="0.6" />
  <path d="M 17.6 7.8 C 18.8 9.7 18.8 12.3 17.6 14.2" fill="none" stroke="#69f0ae" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />

  <!-- Active Listening Central Sphere -->
  <circle cx="11" cy="11" r="4.6" fill="url(#listenCore)" />

  <!-- Entangled Active Loops -->
  <path d="M 6.4 8.2 C 8.4 5.8 15.0 7.8 16.0 12.5 C 16.5 14.5 14.5 16.5 11.8 16.0 C 9.0 15.4 6.5 12.8 6.4 10.4"
        fill="none" stroke="url(#listenGrad)" stroke-width="1.5" stroke-linecap="round" />

  <circle cx="10.3" cy="10.1" r="1.3" fill="#ffffff" opacity="0.9" />
</svg>
