<svg viewBox="-47 -47 520 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Orb (Listening State) -->
    <radialGradient id="bgGradientListen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11222a" />
      <stop offset="65%" stop-color="#09141b" />
      <stop offset="100%" stop-color="#04090e" />
    </radialGradient>

    <!-- Active Listening Neon Cyan Gradient -->
    <linearGradient id="listenCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Active Listening Emerald / Mint Gradient -->
    <linearGradient id="listenEmerald" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Active Listening Radiant Core Glow -->
    <radialGradient id="listenCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rimGlowListen" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="96%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
    </radialGradient>

    <clipPath id="discClipListen">
      <circle cx="213.13" cy="212.95" r="212.5" />
    </clipPath>
  </defs>

  <circle cx="213.13" cy="212.95" r="212.5" fill="url(#bgGradientListen)" />

