<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Top Highlight Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1" />
    </linearGradient>

    <!-- Orb Core Radial Gradient -->
    <radialGradient id="orbCore" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Outer Voice Ribbon 1 (Breeze Cyan - Azure) -->
    <linearGradient id="ribbonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Outer Voice Ribbon 2 (Magenta - Violet AI glow) -->
    <linearGradient id="ribbonMagenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Elevation Shadow -->
  <rect x="4" y="6" width="56" height="56" rx="14" ry="14" fill="#000000" opacity="0.4" />

  <!-- Main Squircle Plate -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Ambient Sound Wave Rings (Acoustic AI field) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.3" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#d946ef" stroke-width="0.75" opacity="0.25" />

  <!-- Left Acoustic Waves -->
  <path d="M12 28 C10 30, 10 34, 12 36" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M15 25 C13 29, 13 35, 15 39" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Right Acoustic Waves -->
  <path d="M52 28 C54 30, 54 34, 52 36" fill="none" stroke="#ff4081" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M49 25 C51 29, 51 35, 49 39" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Back Gyro Orbital Ribbon -->
  <path d="M19 41 C21 21, 43 23, 45 23" fill="none" stroke="url(#ribbonMagenta)" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

  <!-- Siri Voice Central Sphere (Kiri Core) -->
  <circle cx="32" cy="32" r="12" fill="url(#orbCore)" filter="url(#glow)" />

  <!-- Inner Radiant Highlight on Core -->
  <ellipse cx="29.5" cy="27.5" rx="5" ry="3" fill="#ffffff" opacity="0.55" transform="rotate(-25 29.5 27.5)" />

  <!-- Foreground Orbital Ribbons (3D Entangled Siri Waveform) -->
  <!-- Cyan Ribbon -->
  <path d="M18 24 C23 18, 41 24, 46 38 C47 41, 42 45, 34 44 C26 43, 19 36, 18 31"
        fill="none" stroke="url(#ribbonCyan)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Magenta/Violet Ribbon intersecting -->
  <path d="M45 25 C41 19, 23 23, 18 37 C17 40, 22 45, 30 44 C38 43, 44 36, 45 32"
        fill="none" stroke="url(#ribbonMagenta)" stroke-width="2.2" stroke-linecap="round" />

  <!-- AI Sparkle Nods (Top-Right & Bottom-Left) -->
  <path d="M47 13 L48 16 L51 17 L48 18 L47 21 L46 18 L43 17 L46 16 Z" fill="#00e5ff" opacity="0.9" />
  <path d="M15 44 L15.7 46 L18 46.7 L15.7 47.4 L15 49.5 L14.3 47.4 L12 46.7 L14.3 46 Z" fill="#ff4081" opacity="0.85" />
</svg>
