<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <style type="text/css" id="current-color-scheme">
    .ColorScheme-Text { color: #232629; }
    .ColorScheme-Highlight { color: #3daee9; }
  </style>

  <!-- Expanded Listening Waves -->
  <path class="ColorScheme-Text" d="M 2.2 7.0 C 0.8 9.5 0.8 12.5 2.2 15.0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.4" />
  <path class="ColorScheme-Text" d="M 4.4 7.8 C 3.2 9.7 3.2 12.3 4.4 14.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />

  <path class="ColorScheme-Text" d="M 19.8 7.0 C 21.2 9.5 21.2 12.5 19.8 15.0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.4" />
  <path class="ColorScheme-Text" d="M 17.6 7.8 C 18.8 9.7 18.8 12.3 17.6 14.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />

  <!-- Active Listening Central Sphere -->
  <circle class="ColorScheme-Text" cx="11" cy="11" r="4.4" fill="currentColor" opacity="0.95" />

  <!-- Active Loop -->
  <path class="ColorScheme-Text" d="M 6.4 8.2 C 8.4 5.8 15.0 7.8 16.0 12.5 C 16.5 14.5 14.5 16.5 11.8 16.0 C 9.0 15.4 6.5 12.8 6.4 10.4"
