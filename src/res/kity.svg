<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <defs>
    <!-- Breeze Cyan to Azure Gradient -->
    <linearGradient id="panelCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Breeze Magenta to Violet Gradient -->
    <linearGradient id="panelMagenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Core Sphere Gradient -->
    <radialGradient id="panelCore" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>

  <!-- Left Acoustic Voice Wave Arcs -->
  <path d="M 3.8 8.8 C 2.8 10.1 2.8 11.9 3.8 13.2" fill="none" stroke="#00e5ff" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />
  <path d="M 5.8 7.2 C 4.5 9.4 4.5 12.6 5.8 14.8" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0.95" />

  <!-- Right Acoustic Voice Wave Arcs -->
  <path d="M 18.2 8.8 C 19.2 10.1 19.2 11.9 18.2 13.2" fill="none" stroke="#ff4081" stroke-width="1.3" stroke-linecap="round" opacity="0.85" />
  <path d="M 16.2 7.2 C 17.5 9.4 17.5 12.6 16.2 14.8" fill="none" stroke="#d946ef" stroke-width="1.3" stroke-linecap="round" opacity="0.95" />

  <!-- Siri Voice Central Sphere (Kity Core) -->
  <circle cx="11" cy="11" r="4.2" fill="url(#panelCore)" />

  <!-- Entangled Orbital Voice Wave Loops -->
  <!-- Cyan Loop -->
  <path d="M 6.8 8.8 C 8.6 6.5 14.6 8.5 15.6 12.8 C 16.1 14.6 14.2 16.2 11.8 15.8 C 9.2 15.3 6.9 13.0 6.8 10.8"
        fill="none" stroke="url(#panelCyan)" stroke-width="1.4" stroke-linecap="round" />

  <!-- Magenta Loop -->
  <path d="M 15.2 9.0 C 13.4 6.6 7.4 8.7 6.4 13.0 C 5.9 14.8 7.8 16.2 10.2 15.8 C 12.8 15.3 15.1 13.0 15.2 10.8"
        fill="none" stroke="url(#panelMagenta)" stroke-width="1.4" stroke-linecap="round" />

  <!-- Core Radiant Center Pip -->
  <circle cx="10.4" cy="10.2" r="1.1" fill="#ffffff" opacity="0.85" />
</svg>
