  </style>
  <g class="ColorScheme-Text">
    <!-- Expanded Listening Waves -->
    <path d="M 2.2 7.0 C 0.8 9.5 0.8 12.5 2.2 15.0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.4" />
    <path d="M 4.4 7.8 C 3.2 9.7 3.2 12.3 4.4 14.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.75" />

